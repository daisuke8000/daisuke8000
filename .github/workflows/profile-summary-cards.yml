name: Generate profile summary cards

on:
  schedule:
    # Run once a day at 03:17 JST, after the snake workflow.
    - cron: "17 18 * * *"
  workflow_dispatch:

concurrency:
  group: profile-assets-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    name: Generate profile summary cards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate cards
        uses: vn7n24fzkq/github-profile-summary-cards@ccf85b0ff964caab85d4660b3edecbe66838874c
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: ${{ github.ref_name }}
          UTC_OFFSET: 9
          AUTO_PUSH: false
          THEME: tokyonight

      - name: Upload generated cards
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-summary-cards
          path: profile-summary-card-output/tokyonight/
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit profile summary cards
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download generated cards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-summary-cards
          path: profile-summary-card-output/tokyonight/

      - name: Commit updated cards
        shell: bash
        run: |
          if git diff --quiet -- profile-summary-card-output/tokyonight/; then
            echo "Profile summary cards are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/tokyonight/
          git commit -m "chore: update profile summary cards"
          git push origin "HEAD:${GITHUB_REF_NAME}"
