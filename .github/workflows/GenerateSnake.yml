name: Generate contribution snake

on:
  schedule:
    # Run once a day at 02:17 JST. Avoid the busy start of the hour.
    - cron: "17 17 * * *"
  workflow_dispatch:

concurrency:
  group: profile-assets-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            ./img/snake.svg
            ./img/snake-dark.svg?palette=github-dark

      - name: Commit updated SVGs
        shell: bash
        run: |
          if git diff --quiet -- img/; then
            echo "Snake SVGs are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/
          git commit -m "chore: update contribution snake"
          git push origin "HEAD:${GITHUB_REF_NAME}"
